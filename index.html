
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Examen Motor (15 preguntas)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body { font-family: Arial; margin:20px;}
.question { margin-bottom:15px;}
</style>
</head>
<body>

<h2>Examen de Motores</h2>

<label>Nombre del estudiante:</label>
<input type="text" id="nombre"><br><br>

<form id="examForm">

<script>
const preguntas = [
["¿Cuál es la función principal del bloque del motor?", ["A) Generar chispa","B) Soportar y alojar los componentes internos","C) Filtrar el aceite","D) Enfriar el motor"], "B"],
["¿Qué componente convierte el movimiento lineal del pistón en rotación?", ["A) Árbol de levas","B) Cigüeñal","C) Volante","D) Biela"], "B"],
["¿En qué tiempo del ciclo Otto entra la mezcla aire-combustible?", ["A) Compresión","B) Escape","C) Admisión","D) Expansión"], "C"],
["¿Qué elemento enciende la mezcla en un motor a gasolina?", ["A) Inyector","B) Bujía","C) Válvula","D) Pistón"], "B"],
["En un motor diésel, la combustión ocurre por:", ["A) Chispa eléctrica","B) Alta presión y temperatura","C) Fricción del pistón","D) Contacto con aceite"], "B"],
["¿Cuál es la función del árbol de levas?", ["A) Generar potencia","B) Controlar la apertura y cierre de válvulas","C) Regular la presión del aceite","D) Enfriar el motor"], "B"],
["¿Qué válvula permite la salida de gases quemados?", ["A) Admisión","B) Compresión","C) Escape","D) Inyección"], "C"],
["¿Qué sistema se encarga de lubricar las partes móviles del motor?", ["A) Sistema de refrigeración","B) Sistema de escape","C) Sistema de lubricación","D) Sistema eléctrico"], "C"],
["¿Cuál es la función del radiador?", ["A) Aumentar la potencia","B) Disminuir la temperatura del motor","C) Generar presión","D) Filtrar combustible"], "B"],
["¿Qué componente regula la cantidad de aire que entra al motor?", ["A) Pistón","B) Acelerador (cuerpo de aceleración)","C) Cigüeñal","D) Válvula de escape"], "B"],
["¿Qué ocurre en el tiempo de compresión?", ["A) Entra aire","B) Sale el gas","C) Se comprime la mezcla","D) Se enciende la chispa"], "C"],
["¿Cuál es la función de la biela?", ["A) Unir pistón con cigüeñal","B) Enfriar el motor","C) Encender el combustible","D) Filtrar aire"], "A"],
["¿Qué tipo de motor usa bujías?", ["A) Diésel","B) Gasolina","C) Ambos","D) Ninguno"], "B"],
["¿Cuál es el orden correcto del ciclo de 4 tiempos?", ["A) Escape – Admisión – Compresión – Expansión","B) Admisión – Compresión – Expansión – Escape","C) Compresión – Admisión – Escape – Expansión","D) Expansión – Escape – Admisión – Compresión"], "B"],
["¿Qué componente almacena energía y estabiliza el giro del motor?", ["A) Pistón","B) Volante de inercia","C) Árbol de levas","D) Válvula"], "B"]
];

let formHTML = "";
preguntas.forEach((p, i) => {
formHTML += `<div class="question">
<p>${i+1}. ${p[0]}</p>`;
p[1].forEach((opt, j) => {
let letra = ["A","B","C","D"][j];
formHTML += `<input type="radio" name="q${i+1}" value="${letra}"> ${opt}<br>`;
});
formHTML += "</div>";
});
document.write(formHTML);
</script>

</form>

<button onclick="generarPDF()">Finalizar y descargar PDF</button>

<script>
function generarPDF(){
let nombre = document.getElementById("nombre").value || "Estudiante";
let form = document.forms["examForm"];

let texto = "RESULTADO DEL EXAMEN\n\n";
texto += "Nombre: " + nombre + "\n\n";

let puntaje = 0;

preguntas.forEach((p, i)=>{
let q = "q"+(i+1);
let seleccion = form[q].value;
let correcta = p[2];

if(seleccion === correcta){
texto += (i+1)+". Correcta\n";
puntaje++;
}else{
texto += (i+1)+". Incorrecta (Correcta: "+correcta+")\n";
}
});

texto += "\nPuntaje: " + puntaje + " / 15";

const { jsPDF } = window.jspdf;
let doc = new jsPDF();

let lines = doc.splitTextToSize(texto, 180);
doc.text(lines, 10, 10);

doc.save(nombre.replace(/\s+/g,"_") + "_resultado.pdf");
}
</script>

</body>
</html>
